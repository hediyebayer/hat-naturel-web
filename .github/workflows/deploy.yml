name: 🚀 Deploy to Production

# main branch'e her push'ta tetiklenir
on:
  push:
    branches: [main]
  # Manuel tetikleme için (Actions tab'ında "Run workflow" butonu)
  workflow_dispatch:

# Aynı anda sadece 1 deploy çalışsın (yeni push gelirse beklesin)
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            echo "📁 Proje klasörüne giriyorum..."
            cd /var/www/hat-naturel-web

            echo "📥 Git pull (origin/main)..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Dependencies kontrol..."
            # package-lock değiştiyse install, değilse skip
            if git diff HEAD@{1} HEAD --name-only | grep -qE 'package(-lock)?\.json'; then
              echo "  → package.json değişmiş, npm ci çalıştırıyorum..."
              npm ci --omit=dev --no-audit --no-fund || npm install --no-audit --no-fund
            else
              echo "  → package.json değişmemiş, install skip"
            fi

            echo "🏗️  Build (Next.js)..."
            npm run build

            echo "🔄 PM2 reload (zero-downtime)..."
            pm2 reload hat-naturel-web --update-env

            echo "✅ Deploy tamamlandı!"
            pm2 status hat-naturel-web

            # Server-internal health check: PM2 + Next.js gerçekten ayakta mı?
            # localhost:3001 üzerinden kontrol → Nginx/domain bağımsız en güvenilir doğrulama.
            # PM2 reload sonrası Next.js 1-2sn warm-up istediği için önce 3sn beklenir.
            sleep 3
            echo "🏥 Server-internal health check (localhost:3001)..."
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/tr)
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ]; then
                echo "  ✅ Next.js ayakta (localhost:3001/tr → HTTP $STATUS)"
                break
              fi
              echo "  Deneme $i: HTTP $STATUS — 3sn bekleyip tekrar..."
              sleep 3
              if [ "$i" = "5" ]; then
                echo "  ❌ Next.js cevap vermiyor! PM2 log:"
                pm2 logs hat-naturel-web --lines 30 --nostream
                exit 1
              fi
            done
          ENDSSH

      - name: 🌐 Health check (dışarıdan HTTPS domain)
        # Server-internal check yukarıda SSH bloğunda geçti.
        # Burada dış dünyanın gördüğü HTTPS domain'i doğruluyoruz (Nginx + SSL + DNS).
        # http://IP yerine https://domain kullanıyoruz: raw IP Nginx'te default vhost'a
        # düşüp 404 döndürüyordu (eski failure'ların sebebi buydu).
        run: |
          sleep 5
          URL="https://hatnaturel.com.tr/tr"
          echo "🏥 Site canlı mı kontrol: $URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Site canlıda (HTTP $STATUS)"
              exit 0
            fi
            echo "Deneme $i: HTTP $STATUS — 5sn bekleyip tekrar..."
            sleep 5
          done
          echo "❌ Site dışarıdan cevap vermiyor! (server-internal check zaten geçmiş olmalı → Nginx/SSL sorunu)"
          exit 1

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
